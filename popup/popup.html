<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tab-shortcuts</title>
    <style>
        :root {
            --bg: #fdfdfd;
            --bg-elev: #f1f3f5;
            --fg: #1f2937;
            --fg-dim: #4b5563;
            --muted: #9ca3af;
            --accent: #15803d;
            --accent-soft: rgba(21, 128, 61, 0.08);
            --accent-glow: rgba(21, 128, 61, 0.18);
            --cyan: #0e7490;
            --magenta: #be185d;
            --border: #d1d5db;
            --kbd-bg: #f0fdf4;
            --kbd-border: #86efac;
            --kbd-fg: #166534;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            width: 300px;
            font-family: "JetBrains Mono", "SF Mono", Menlo, Monaco, "Cascadia Code", "Courier New", monospace;
            font-size: 12px;
            line-height: 1.45;
            color: var(--fg);
            background: var(--bg);
            border: 1px solid var(--accent-glow);
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.03) inset,
                0 0 40px rgba(21, 128, 61, 0.04);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent 0 2px,
                rgba(0, 0, 0, 0.025) 2px 3px
            );
            pointer-events: none;
            z-index: 50;
        }

        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(21, 128, 61, 0.05), transparent 60%);
            pointer-events: none;
            z-index: 40;
        }

        .titlebar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--bg-elev);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 60;
        }
        .titlebar .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ff5f56;
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08);
        }
        .titlebar .dot:nth-child(2) { background: #ffbd2e; }
        .titlebar .dot:nth-child(3) { background: #27c93f; }
        .titlebar .title {
            margin-left: 10px;
            color: var(--fg-dim);
            font-size: 11px;
            letter-spacing: 0.3px;
        }
        .titlebar .title .tilde { color: var(--muted); }

        h1 { display: none; }

        .commands {
            padding: 10px 0 8px;
            position: relative;
            z-index: 60;
        }

        button {
            width: 100%;
            padding: 6px 12px 6px 14px;
            margin: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            line-height: 1.4;
            text-align: left;
            color: var(--fg);
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 10px;
            border-left: 2px solid transparent;
            transition: background 80ms linear, border-color 80ms linear, color 80ms linear;
            position: relative;
        }
        button .cmd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        button .cmd::before {
            content: "$ ";
            color: var(--accent);
            margin-right: 2px;
            opacity: 0.7;
        }
        button:hover, button:focus {
            background: linear-gradient(90deg, var(--accent-soft), transparent);
            border-left-color: var(--accent);
            color: var(--accent);
            outline: none;
        }
        button:hover .cmd::before, button:focus .cmd::before {
            color: var(--accent);
            opacity: 1;
        }
        button:active {
            background: rgba(21, 128, 61, 0.14);
        }

        .keyboard {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .keyboard kbd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1px 6px;
            min-width: 22px;
            height: 18px;
            font-family: inherit;
            font-size: 10px;
            font-weight: 600;
            color: var(--kbd-fg);
            background: var(--kbd-bg);
            border: 1px solid var(--kbd-border);
            border-radius: 2px;
            line-height: 1;
        }
        .keyboard .plus {
            font-size: 10px;
            color: var(--muted);
            margin: 0 1px;
        }
        .keyboard.unset {
            color: var(--muted);
            font-style: italic;
            font-size: 11px;
            padding: 1px 4px;
            letter-spacing: 0.3px;
        }

        .config-link {
            display: block;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 12px;
            color: var(--cyan);
            cursor: pointer;
            border-top: 1px dashed var(--border);
            position: relative;
            z-index: 60;
            transition: background 80ms linear, color 80ms linear;
        }
        .config-link::before {
            content: "❯ ";
            color: var(--accent);
        }
        .config-link:hover {
            background: rgba(14, 116, 144, 0.08);
            color: var(--accent);
        }
        .config-link:hover::before { color: var(--accent); }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 12px;
            background: var(--bg-elev);
            border-top: 1px solid var(--border);
            font-size: 10px;
            color: var(--fg-dim);
            letter-spacing: 0.3px;
            position: relative;
            z-index: 60;
            cursor: pointer;
            text-decoration: none;
            transition: background 80ms linear, color 80ms linear;
        }
        .footer:hover { background: rgba(21, 128, 61, 0.06); }
        .footer:hover .left { color: var(--accent); }
        .footer:hover .left .hash { color: var(--accent); }
        .footer .left  { color: var(--muted); transition: color 80ms linear; }
        .footer .left .hash { color: var(--accent); transition: color 80ms linear; }
        .footer .right { color: var(--cyan); }
    </style>
</head>

<body>
    <div class="titlebar">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="title">tab-shortcuts <span class="tilde">—</span> v1.7</span>
    </div>

    <div class="commands">
        <button id="duplicateTab">
            <span class="cmd">duplicate-tab</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="pinTab">
            <span class="cmd">pin-tab</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="newTabHere">
            <span class="cmd">new-tab-here</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="newTabHereBackground">
            <span class="cmd">new-tab-here --bg</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="preventClose">
            <span class="cmd">prevent-close</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="collapseTranslations">
            <span class="cmd">collapse-translations</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="convertRelativeTime">
            <span class="cmd">convert-relative-time</span>
            <span class="keyboard">Loading...</span>
        </button>
    </div>

    <div class="config-link" id="configureShortcuts">
        configure --shortcuts
    </div>

    <div class="footer" id="repoLink" title="Open on GitHub">
        <span class="left"><span class="hash">#</span> @triuzzi/tab-shortcuts</span>
        <span class="right">v1.7</span>
    </div>

    <script src="popup.js"></script>
</body>

</html>
