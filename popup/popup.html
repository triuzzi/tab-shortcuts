<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Shortcuts</title>
    <style>
        :root {
            --bg: #ffffff;
            --bg-soft: #f9fafb;
            --fg: #111827;
            --fg-muted: #6b7280;
            --fg-dim: #9ca3af;
            --border: #e5e7eb;
            --accent: #2563eb;
            --accent-soft: #eff6ff;
            --hover: #f3f4f6;
            --kbd-bg: #f9fafb;
            --kbd-border: #d1d5db;
            --kbd-fg: #374151;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            width: 300px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 13px;
            color: var(--fg);
            background: var(--bg);
        }

        .header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        .header .subtitle {
            margin-top: 2px;
            font-size: 11px;
            color: var(--fg-muted);
            letter-spacing: 0.1px;
        }

        .commands {
            padding: 6px 0;
        }

        button {
            width: 100%;
            padding: 9px 16px;
            margin: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            text-align: left;
            color: var(--fg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: background 100ms linear;
        }
        button:hover { background: var(--hover); }
        button:focus { outline: none; background: var(--accent-soft); }
        button .label {
            font-weight: 500;
            line-height: 1.3;
        }

        .keyboard {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
        }
        .keyboard kbd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 7px;
            min-width: 22px;
            height: 20px;
            font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            font-weight: 600;
            color: var(--kbd-fg);
            background: var(--kbd-bg);
            border: 1px solid var(--kbd-border);
            border-radius: 4px;
            box-shadow: 0 1px 0 0 var(--kbd-border);
            line-height: 1;
        }
        .keyboard .plus {
            font-size: 10px;
            color: var(--fg-dim);
            margin: 0 1px;
        }
        .keyboard.unset {
            font-size: 11px;
            color: var(--fg-dim);
            font-style: italic;
            padding: 2px 6px;
        }

        .config-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            color: var(--accent);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 100ms linear;
        }
        .config-link:hover { background: var(--accent-soft); }

        .footer {
            display: flex;
            justify-content: space-between;
            padding: 8px 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-soft);
            color: var(--fg-muted);
            font-size: 10px;
            letter-spacing: 0.3px;
        }
        .footer .right { color: var(--fg-dim); }
    </style>
</head>

<body>
    <div class="header">
        <h1>Tab Shortcuts</h1>
        <div class="subtitle">Keyboard shortcuts for smart tab control</div>
    </div>

    <div class="commands">
        <button id="duplicateTab">
            <span class="label">Duplicate Tab</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="pinTab">
            <span class="label">Pin / Unpin Tab</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="newTabHere">
            <span class="label">New Tab Here</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="newTabHereBackground">
            <span class="label">New Tab Here (Background)</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="preventClose">
            <span class="label">Prevent Tab Close</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="collapseTranslations">
            <span class="label">Collapse Translations</span>
            <span class="keyboard">Loading...</span>
        </button>

        <button id="convertRelativeTime">
            <span class="label">Convert Time to Absolute</span>
            <span class="keyboard">Loading...</span>
        </button>
    </div>

    <div class="config-link" id="configureShortcuts">
        <span>⚙</span><span>Configure Shortcuts</span>
    </div>

    <div class="footer">
        <span class="left">v1.6 · @triuzzi</span>
        <span class="right">Tab Shortcuts</span>
    </div>

    <script src="popup.js"></script>
</body>

</html>
