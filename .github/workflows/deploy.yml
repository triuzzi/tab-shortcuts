name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths: [site/**]
  workflow_dispatch:

concurrency:
  group: deploy-tab-shortcuts
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: tab-shortcuts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout triuzzi.github.io
        uses: actions/checkout@v4
        with:
          repository: triuzzi/triuzzi.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: target-repo

      - name: Copy icons to site
        run: cp -r icons site/icons

      - name: Deploy to subfolder
        run: |
          rm -rf target-repo/public/${{ env.APP_NAME }}
          cp -r site target-repo/public/${{ env.APP_NAME }}

      - name: Commit and push
        working-directory: target-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/${{ env.APP_NAME }}/
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy tab-shortcuts from ${GITHUB_SHA::7}"
            git push
          fi
